name: Temporary tab style cleanup

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Remove unsupported tabmargins style option
        shell: python
        run: |
          from pathlib import Path
          p = Path('main.py')
          s = p.read_text(encoding='utf-8')
          old = 'self.style.configure("TNotebook", background=bg_dark, borderwidth=0, tabmargins=[0, 0, 0, 0])'
          new = 'self.style.configure("TNotebook", background=bg_dark, borderwidth=0)'
          if old not in s:
              raise SystemExit('tabmargins marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Validate and commit
        shell: bash
        run: |
          python -m py_compile main.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git rm .github/workflows/_tmp_tab_style_cleanup.yml
          git diff --cached --check
          git commit -m "chore: finalize tab style"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
