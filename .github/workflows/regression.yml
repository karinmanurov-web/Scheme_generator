name: Regression tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# The regression suite lives with the PR code. Run it for PRs only so a
# workflow commit on main does not try to execute tests that are not in main.
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Test the actual PR head, not GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        id: install
        run: python -m pip install -r tests/requirements.txt

      - name: Test generic layout engine, structural detection, presentation audit and cones
        run: python -m pytest -q tests/test_layout_engine.py tests/test_piles_structural.py tests/test_presentation_audit.py tests/test_cones.py

      - name: Run headless regression checks and render previews
        run: python tests/run_regression.py

      - name: Audit generated content stays inside frame
        if: success()
        run: python tests/presentation_audit.py

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheme-generator-regression-report
          path: reports/
          if-no-files-found: warn
